.loader{display:flex;gap:6px;justify-content:center;padding:40px 0}.loader i{width:10px;height:10px;border-radius:50%;background:var(--teal);animation:bounce 1s ease-in-out infinite}.loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
.foot{max-width:1240px;margin:0 auto;padding:4px 14px 24px;font-size:12px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
@media(max-width:700px){.top{position:static}.nav{top:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.45}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,8px)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

var lang='bm'; try{lang=localStorage.getItem('fe_sk_lang')||'bm'}catch(e){}
function L(k){var v=T[k];return v?(lang==='en'?v[1]:v[0]):k}
function F(k,o){var s=L(k);Object.keys(o).forEach(function(x){s=s.split('{'+x+'}').join(o[x])});return s}
var MON={bm:['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
var STAT_BM={'Baru':'Baharu'};var STAT_EN={'Baru':'New','Dibayar':'Paid','Dalam Proses':'In progress','Dihantar':'Shipped','Selesai':'Completed','Batal':'Cancelled','Draf':'Draft','Jadi pesanan':'Converted'};
function stName(s){return lang==='en'?(STAT_EN[s]||s):(STAT_BM[s]||s)}

// ================================================================ util
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function num(v){var x=Number(v);return isFinite(x)?x:0}
function r2(v){return Math.round(num(v)*100)/100}
function rm(v){v=num(v);return (v<0?'−':'')+'RM'+Math.abs(v).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}
function rmu(v){return 'RM'+(Math.abs(v)<1?num(v).toFixed(3):num(v).toFixed(2))}
function pct(v){return isFinite(v)?v.toFixed(1)+'%':'-'}
function n2(v){return num(v).toLocaleString('en-MY',{maximumFractionDigits:2})}
function nowStr(){var d=new Date(),p=function(x){return('0'+x).slice(-2)};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function ymNow(){return nowStr().slice(0,7)}
function ymLabel(ym){var p=ym.split('-');return MON[lang][num(p[1])-1]+' '+p[0]}
function ymShift(ym,k){var p=ym.split('-').map(Number);var d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
var tt;function toast(m){var t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;t.style.animation='none';t.offsetHeight;t.style.animation='';clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}
function copy(text){try{navigator.clipboard.writeText(text).then(function(){toast(L('disalin'))},function(){fallbackCopy(text)})}catch(e){fallbackCopy(text)}}
function fallbackCopy(text){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(L('disalin'))}catch(e){toast(L('gagalSalin'))}ta.remove()}
function tableText(rows){return rows.map(function(r){return r.join('\t')}).join('\n')}
function countUp(root){root.querySelectorAll('[data-v]').forEach(function(el){var to=num(el.getAttribute('data-v')),money=el.hasAttribute('data-rm');function f(v){return money?rm(v):Math.round(v).toLocaleString('en-MY')}if(reduce){el.textContent=f(to);return}var t0=null;function st(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/900),e=1-Math.pow(1-k,3);el.textContent=f(to*e);if(k<1)requestAnimationFrame(st)}requestAnimationFrame(st)})}
function grow(root){requestAnimationFrame(function(){requestAnimationFrame(function(){root.querySelectorAll('[data-w]').forEach(function(e){e.style.width=e.getAttribute('data-w')});root.querySelectorAll('[data-h]').forEach(function(e){e.style.height=e.getAttribute('data-h')})})})}
var tip=$('tip');
function tips(root){root.querySelectorAll('[data-tip]').forEach(function(e){e.addEventListener('mousemove',function(ev){tip.textContent=this.getAttribute('data-tip');tip.style.opacity=1;tip.style.left=Math.min(ev.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(ev.clientY-38)+'px'});e.addEventListener('mouseleave',function(){tip.style.opacity=0})})}
function after(root){countUp(root);grow(root);tips(root)}
function sel(opts,v){return opts.map(function(o){var val=Array.isArray(o)?o[0]:o,lab=Array.isArray(o)?o[1]:o;return '<option value="'+esc(val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(lab)+'</option>'}).join('')}
function formData(form){var d={};form.querySelectorAll('[name]').forEach(function(i){if(i.type==='checkbox')d[i.name]=i.checked;else d[i.name]=i.value});return d}

// ================================================================ api
var API_URL=window.API_URL||'';
function getPin(){try{return localStorage.getItem('fe_pin')||''}catch(e){return window.__pin||''}}
function setPin(v){window.__pin=v;try{if(v)localStorage.setItem('fe_pin',v);else localStorage.removeItem('fe_pin')}catch(e){}}
function post(body){return fetch(API_URL,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){return r.json()})}
function call(action,p){
  if(API_URL&&!window.DEMO_MODE){return post({a:action,p:p||{},pin:getPin()}).then(function(r){if(r&&(r.pinSalah||r.perluPin)){setPin('');try{localStorage.removeItem('fe_D')}catch(e){}pinGate(r.error);throw new Error('pin')}return r})}
  return new Promise(function(res,rej){try{google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(action,p||{})}catch(e){rej(e)}})}
function pinGate(msg){
  post({a:'auth.status'}).then(function(st){var baru=!st.adaPin;
    $('app').innerHTML='<div class="card pin-card"><img src="'+((document.querySelector('.top img')||{}).src||'')+'" alt="" style="width:56px;height:56px;border-radius:14px"><h2 style="margin:12px 0 4px">'+(baru?L('pinCipta'):L('pinMasuk'))+'</h2><p class="muted">'+(baru?L('pinCiptaP'):L('pinMasukP'))+'</p>'+(msg?'<p class="neg" style="margin:6px 0">'+esc(msg)+'</p>':'')
      +'<form id="pf1"><input id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="'+(baru?'new-password':'current-password')+'" placeholder="••••" class="pin-in">'+(baru?'<input id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="'+L('pinUlang')+'" class="pin-in">':'')+'<button class="btn" style="width:100%;margin-top:10px">'+(baru?L('pinSimpan'):L('pinBuka'))+'</button></form></div>';
    $('pin1').focus();
    $('pf1').addEventListener('submit',function(e){e.preventDefault();var v=$('pin1').value.trim();if(!/^\d{4,8}$/.test(v)){toast(L('pinFormat'));return}
      if(baru){if($('pin2').value.trim()!==v){toast(L('pinTakSama'));return}post({a:'auth.setup',pin:v}).then(function(r){if(!r.ok){toast(r.error);return}setPin(v);load()})}

  q=q||{id:'',pelanggan:'',telefon:'',kawasan:'SM',postage:'',nota:'',status:'Draf'};if(!items.length)items=[{produk_id:'',kuantiti:'',jual:''}];
  var postTouched=!isNew,kaw=q.kawasan||'SM';
  var body=openM('<h2>'+(isNew?L('shBaru').replace('+ ',''):esc(q.id))+'</h2><div class="g2" style="margin-top:12px"><div><form id="qf"><div class="g2"><div class="f"><label class="l">'+L('pelanggan')+'</label><input name="pelanggan" value="'+esc(q.pelanggan)+'"></div><div class="f"><label class="l">'+L('telefon')+'</label><input name="telefon" inputmode="tel" value="'+esc(q.telefon)+'"></div></div><div class="f"><label class="l">'+L('kawasan')+'</label><div class="seg" id="qk">'+[['SM','sm'],['SS','ss'],['Ambil','ambil']].map(function(k){return '<button type="button" data-k="'+k[0]+'" class="'+(kaw===k[0]?'on':'')+'">'+L(k[1])+'</button>'}).join('')+'</div></div><div id="qi"></div><button type="button" class="btn sm ghost" id="qa" style="margin-bottom:10px">'+L('tambahItem')+'</button><div class="g2"><div class="f"><label class="l">'+L('postage')+' (RM)</label><input name="postage" type="number" step="0.01" min="0" value="'+esc(q.postage)+'"></div><div class="f"><label class="l">'+L('status')+'</label><select name="status">'+sel([['Draf',stName('Draf')],['Dihantar',stName('Dihantar')],['Jadi pesanan',stName('Jadi pesanan')]],q.status)+'</select></div></div><div class="f"><label class="l">'+L('nota')+'</label><input name="nota" value="'+esc(q.nota)+'"></div></form></div><div><div class="quote" id="qp"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="qs">'+L('simpan')+'</button><button class="btn ghost" id="qc">'+L('salinWA')+'</button><a class="btn wa" id="qw" target="_blank" rel="noopener">'+L('hantarWA')+'</a>'+(!isNew&&q.status!=='Jadi pesanan'?'<button class="btn navy" id="qo">'+L('jadiPesanan')+'</button>':'')+(!isNew?'<button class="btn red" id="qd">'+L('padam')+'</button>':'')+'</div></div></div>');
  var f=body.querySelector('#qf');
  function drawItems(){body.querySelector('#qi').innerHTML=items.map(function(it,i){var p=prodBy(it.produk_id);return '<div class="g3" style="grid-template-columns:2fr 1fr 1fr auto;align-items:end;margin-bottom:6px" data-i="'+i+'"><div><label class="l">'+L('produk')+'</label><select data-f="produk_id"><option value="">'+L('pilih')+'</option>'+sel(D.produk.filter(function(x){return x.status!=='tutup'}).map(function(x){return[x.id,pname(x)]}),it.produk_id)+'</select></div><div><label class="l">'+L('qty')+'</label><input data-f="kuantiti" type="number" min="1" value="'+esc(it.kuantiti)+'" list="ql'+i+'"><datalist id="ql'+i+'">'+(p?p.tiers.map(function(t){return '<option value="'+t[0]+'">'}).join(''):'')+'</datalist></div><div><label class="l">'+L('jual')+'</label><input data-f="jual" type="number" step="0.01" min="0" value="'+esc(it.jual)+'"></div><button type="button" class="btn sm red" data-x="'+i+'" style="margin-bottom:3px">✕</button></div>'}).join('');
    body.querySelectorAll('#qi [data-i]').forEach(function(row){var i=+row.getAttribute('data-i');row.querySelectorAll('[data-f]').forEach(function(inp){inp.addEventListener('change',function(){var k=this.getAttribute('data-f');items[i][k]=this.value;if(k!=='jual'){var p=prodBy(items[i].produk_id);if(p){if(k==='produk_id'&&!items[i].kuantiti&&p.tiers[0])items[i].kuantiti=p.tiers[0][0];if(num(items[i].kuantiti)>0)items[i].jual=r2(tierPrice(p,num(items[i].kuantiti)).jual*sstF(p))}drawItems()}autoPost();prev()})})});
    body.querySelectorAll('#qi [data-x]').forEach(function(b){b.addEventListener('click',function(){items.splice(+this.getAttribute('data-x'),1);if(!items.length)items.push({produk_id:'',kuantiti:'',jual:''});drawItems();autoPost();prev()})})}
  function autoPost(){if(postTouched)return;var mx=0;items.forEach(function(it){var p=prodBy(it.produk_id);if(p)mx=Math.max(mx,kaw==='SM'?num(p.postage_sm):kaw==='SS'?num(p.postage_ss):0)});f.postage.value=mx}
  function calc(){var good=items.filter(function(it){return prodBy(it.produk_id)&&num(it.kuantiti)>0});var sub=0,sst=0;good.forEach(function(it){var p=prodBy(it.produk_id);sub+=num(it.jual);sst+=num(it.jual)-num(it.jual)/sstF(p)});var post=num(f.postage.value);return{good:good,sub:r2(sub),sst:r2(sst),post:r2(post),tot:r2(sub+post)}}
  function text(){var c=calc(),d=formData(f);var lines=['*'+L('shTeks1')+' FAIMS EMPIRE*',(q.id?L('noSH')+' '+q.id+' · ':'')+nowStr().slice(0,10),d.pelanggan?L('pelanggan')+': '+d.pelanggan:'',''];c.good.forEach(function(it,i){var p=prodBy(it.produk_id);lines.push((i+1)+'. '+pname(p)+' × '+n2(it.kuantiti)+' '+p.unit+' = '+rm(it.jual))});lines.push('');lines.push(L('subtotal')+': '+rm(c.sub));if(c.sst)lines.push('('+L('termasukSst')+' '+sstPct()+'%: '+rm(c.sst)+')');lines.push(L('postage')+' ('+L(kaw==='SM'?'sm':kaw==='SS'?'ss':'ambil')+'): '+rm(c.post));lines.push('*'+L('jumlah')+': '+rm(c.tot)+'*');lines.push('');if(d.nota)lines.push(d.nota);lines.push(L('sah'));lines.push(L('shTerima'));return lines.filter(function(x,i,a){return !(x===''&&a[i-1]==='')}).join('\n')}
  function prev(){var c=calc(),d=formData(f);body.querySelector('#qp').innerHTML='<div class="qh"><div><b style="font-family:var(--display)">'+L('shTeks1')+'</b><br><span class="muted">'+esc((D.tetapan||{}).nama_kedai||'FAIMS EMPIRE')+'</span></div><div class="muted" style="text-align:right">'+esc(q.id||'')+'<br>'+nowStr().slice(0,10)+'</div></div>'+(d.pelanggan?'<p style="margin:0 0 8px">'+L('pelanggan')+': <b>'+esc(d.pelanggan)+'</b></p>':'')+'<table>'+c.good.map(function(it){var p=prodBy(it.produk_id);return '<tr><td>'+esc(pname(p))+'<br><span class="muted">'+n2(it.kuantiti)+' '+esc(p.unit)+'</span></td><td class="n">'+rm(it.jual)+'</td></tr>'}).join('')+'<tr><td>'+L('subtotal')+'</td><td class="n">'+rm(c.sub)+'</td></tr>'+(c.sst?'<tr><td class="muted">'+L('termasukSst')+' '+sstPct()+'%</td><td class="n muted">'+rm(c.sst)+'</td></tr>':'')+'<tr><td>'+L('postage')+'</td><td class="n">'+rm(c.post)+'</td></tr><tfoot><tr><td>'+L('jumlah')+'</td><td class="n">'+rm(c.tot)+'</td></tr></tfoot></table><p class="muted" style="margin:8px 0 0">'+L('sah')+'</p>';
    var tel=String(d.telefon||'').replace(/\D/g,'').replace(/^0/,'60');body.querySelector('#qw').href='https://wa.me/'+(tel||'')+'?text='+encodeURIComponent(text())}
  drawItems();if(isNew)autoPost();prev();
  f.addEventListener('input',function(e){if(e.target.name==='postage')postTouched=true;prev()});
  body.querySelectorAll('#qk button').forEach(function(b){b.addEventListener('click',function(){kaw=this.getAttribute('data-k');body.querySelectorAll('#qk button').forEach(function(x){x.classList.toggle('on',x===b)});postTouched=false;autoPost();prev()})});
  body.querySelector('#qa').addEventListener('click',function(){items.push({produk_id:'',kuantiti:'',jual:''});drawItems()});
  body.querySelector('#qc').addEventListener('click',function(){copy(text())});
  function payload(){var d=formData(f);d.id=q.id;d.kawasan=kaw;d.items=calc().good.map(function(it){var p=prodBy(it.produk_id);return {produk_id:it.produk_id,kuantiti:it.kuantiti,jual:num(it.jual)/sstF(p)}});return d}
  body.querySelector('#qs').addEventListener('click',function(){run('sh.save',{sh:payload()},L('disimpan')).then(function(r){if(r&&r.ok)closeM()})});
  var qo=body.querySelector('#qo');if(qo)qo.addEventListener('click',function(){var b2=openM('<h2>'+L('jadiPesanan')+'</h2><form id="cf" style="margin-top:12px"><div class="g2"><div class="f"><label class="l">'+L('platform')+'</label><select name="platform">'+sel(platforms(),'WhatsApp / Walk-in')+'</select></div><div class="f"><label class="l">'+L('diurus')+'</label><select name="diurus_oleh">'+sel(handlers().map(function(u){return[u.username,u.nama]}),'Sendiri')+'</select></div></div><button class="btn" type="submit">'+L('jadiPesanan')+'</button></form>',true);
    b2.querySelector('#cf').addEventListener('submit',function(e){e.preventDefault();var d=formData(this);d.id=q.id;run('sh.save',{sh:payload()},null,false).then(function(){return run('sh.tukar',d,L('dijadikan'))}).then(function(r){if(r&&r.ok){closeM();tab='pesanan';render()}})})});
  var qd=body.querySelector('#qd');if(qd)confirmBtn(qd,function(){run('sh.delete',{id:q.id},L('dipadam')).then(closeM)});
}

// ================================================================ tetapan
function vTetapan(v){
  var t=D.tetapan||{};
  v.innerHTML='<div class="card" style="max-width:760px"><h3>'+L('kedai')+'</h3><form id="tf"><div class="g2"><div class="f"><label class="l">'+L('namaKedai')+'</label><input name="nama_kedai" value="'+esc(t.nama_kedai||'')+'"></div><div class="f"><label class="l">'+L('sstPct')+'</label><input name="sst_pct" type="number" step="0.5" min="0" value="'+esc(t.sst_pct||5)+'"></div></div><div class="f"><label class="l">'+L('senaraiPlat')+'</label><input name="platform" value="'+esc(t.platform||'')+'"></div><div class="f"><label class="l">'+L('senaraiAdmin')+'</label><input name="senarai_admin" value="'+esc(t.senarai_admin||'')+'"><span class="muted">'+L('senaraiAdminP')+'</span></div><button class="btn" type="submit">'+L('simpan')+'</button></form></div>'
   +'<div class="card" style="max-width:760px;margin-top:14px"><h3>'+L('menuPapar')+'</h3><p class="muted">'+L('menuPaparP')+'</p>'+[['sh','tSH'],['pembekal','tPembekal'],['upah','lUpah']].map(function(m){return '<label class="chk"><input type="checkbox" data-ms="'+m[0]+'"'+(sorok().indexOf(m[0])<0?' checked':'')+'> '+L(m[1])+'</label>'}).join('')+'</div>'
   +'<p class="muted" style="text-align:center">v'+esc(D.version||'')+'</p>';
  $('tf').addEventListener('submit',function(e){e.preventDefault();run('tetapan.save',{tetapan:formData(this)},L('disimpan'))});
  v.querySelectorAll('[data-ms]').forEach(function(c){c.addEventListener('change',function(){var hid=[];v.querySelectorAll('[data-ms]').forEach(function(x){if(!x.checked)hid.push(x.getAttribute('data-ms'))});var val=hid.join(',')||' ';D.tetapan.menu_sorok=val;run('tetapan.save',{tetapan:{menu_sorok:val}},L('disimpan'))})});
}

applyLang();
(function(){var b=$('rfBtn');if(!b)return;b.addEventListener('click',function(){if(API_URL&&!window.DEMO_MODE&&!getPin()){pinGate();return}Promise.resolve(load()).then(function(){toast(L('dikemas'))})})})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&API_URL){navigator.serviceWorker.register('sw.js').catch(function(){})}
if(API_URL&&!window.DEMO_MODE&&!getPin())pinGate();else{var c0=(API_URL&&!window.DEMO_MODE)?cachedD():null;if(c0){D=c0;me=c0.me;try{render()}catch(e){}}load()}
})();
